name: Validate Marketplace preview

on:
  pull_request:
    paths:
      - '.github/workflows/preview-check.yml'
      - '.github/workflows/publish.yml'
      - 'extension/**'
      - 'scripts/**'
      - 'src/**'
      - 'templates/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'README.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'uv==0.13.6'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: extension
      - run: python scripts/build_bundle_catalog.py --check
      - run: npm test
        working-directory: extension
      - run: uv run --locked pytest tests/ -o addopts=''
      - name: Build and audit VSIX
        working-directory: extension
        env:
          TZ: UTC
        run: |
          npm run package
          npm run verify-package
          npm run check:payload
          sha256sum ../dist/research-stack-toolkit-0.3.10.vsix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: research-stack-preview-vsix
          path: dist/research-stack-toolkit-0.3.10.vsix
          if-no-files-found: error
          retention-days: 7

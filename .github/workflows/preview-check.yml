name: Validate Marketplace preview

on:
  pull_request:
    paths:
      - '.github/workflows/preview-check.yml'
      - '.github/workflows/publish.yml'
      - 'extension/**'
      - 'scripts/**'
      - 'src/**'
      - 'templates/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'README.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Determine release artifact
        id: release
        run: node extension/scripts/release-artifact.js >> "$GITHUB_OUTPUT"
      - name: Test release artifact selection
        run: node --test extension/test/release-artifact.test.js
      - run: python -m pip install 'uv==0.13.6'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: extension
      - run: python scripts/build_bundle_catalog.py --check
      - name: Generate reviewed worker and guides
        run: |
          python scripts/build_guide_index.py
          python scripts/build_worker_bundle.py
      - run: npm test
        working-directory: extension
      - run: uv run --locked pytest tests/ -o addopts=''
      - name: Build and audit VSIX
        working-directory: extension
        env:
          TZ: UTC
          VSIX_PATH: ${{ steps.release.outputs.path }}
        run: |
          npm run package
          npm run verify-package
          npm run check:payload
          sha256sum "../$VSIX_PATH"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: research-stack-preview-vsix
          path: ${{ steps.release.outputs.path }}
          if-no-files-found: error
          retention-days: 7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: research-stack-preview-vsix
          path: verified-artifact
      - name: Verify artifact round trip
        env:
          VSIX_PATH: ${{ steps.release.outputs.path }}
          VSIX_FILENAME: ${{ steps.release.outputs.filename }}
        run: |
          cmp "$VSIX_PATH" "verified-artifact/$VSIX_FILENAME"
          sha256sum "verified-artifact/$VSIX_FILENAME"

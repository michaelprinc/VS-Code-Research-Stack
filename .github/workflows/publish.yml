name: Publish Research Stack Toolkit

on:
  workflow_dispatch:
    inputs:
      reviewed_sha256:
        description: SHA-256 of the independently reviewed and tested VSIX
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      artifact_version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Determine release artifact
        id: release
        run: node extension/scripts/release-artifact.js >> "$GITHUB_OUTPUT"
      - name: Test release artifact selection
        run: node --test extension/test/release-artifact.test.js
      - name: Install toolchain
        run: python -m pip install 'uv==0.13.6'
      - name: Install extension development dependencies
        working-directory: extension
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify bundle catalog
        run: python scripts/build_bundle_catalog.py --check
      - name: Generate reviewed worker and guides
        run: |
          python scripts/build_guide_index.py
          python scripts/build_worker_bundle.py
      - name: Run Node tests
        working-directory: extension
        run: npm test
      - name: Run Python tests
        run: uv run --locked pytest tests/ -o addopts=''
      - name: Build and audit candidate
        working-directory: extension
        env:
          TZ: UTC
        run: |
          npm run package
          npm run verify-package
          npm run check:payload
      - name: Match reviewed VSIX
        env:
          REVIEWED_SHA256: ${{ inputs.reviewed_sha256 }}
          VSIX_PATH: ${{ steps.release.outputs.path }}
        run: |
          [[ "$REVIEWED_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]
          printf '%s  %s\n' "$REVIEWED_SHA256" "$VSIX_PATH" | sha256sum --check --strict
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: reviewed-vsix
          path: ${{ steps.release.outputs.path }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: reviewed-vsix
          path: dist
      - name: Recheck reviewed VSIX
        env:
          REVIEWED_SHA256: ${{ inputs.reviewed_sha256 }}
          VSIX_VERSION: ${{ needs.build.outputs.artifact_version }}
        run: |
          [[ "$REVIEWED_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]
          printf '%s  %s\n' "$REVIEWED_SHA256" "dist/research-stack-toolkit-${VSIX_VERSION}.vsix" | sha256sum --check --strict
      - name: Publish exact verified VSIX
        env:
          VSIX_VERSION: ${{ needs.build.outputs.artifact_version }}
        run: npx --yes --package @vscode/vsce@4.1.0 vsce publish --oidc --packagePath "dist/research-stack-toolkit-${VSIX_VERSION}.vsix"

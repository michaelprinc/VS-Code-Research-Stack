name: Publish Research Stack Toolkit

on:
  workflow_dispatch:
    inputs:
      reviewed_sha256:
        description: SHA-256 of the independently reviewed and tested VSIX
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install toolchain
        run: python -m pip install 'uv==0.13.6'
      - name: Install extension development dependencies
        working-directory: extension
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify bundle catalog
        run: python scripts/build_bundle_catalog.py --check
      - name: Generate reviewed worker and guides
        run: |
          python scripts/build_guide_index.py
          python scripts/build_worker_bundle.py
      - name: Run Node tests
        working-directory: extension
        run: npm test
      - name: Run Python tests
        run: uv run --locked pytest tests/ -o addopts=''
      - name: Build and audit candidate
        working-directory: extension
        env:
          TZ: UTC
        run: |
          npm run package
          npm run verify-package
          npm run check:payload
      - name: Match reviewed VSIX
        env:
          REVIEWED_SHA256: ${{ inputs.reviewed_sha256 }}
        run: |
          [[ "$REVIEWED_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]
          printf '%s  %s\n' "$REVIEWED_SHA256" dist/research-stack-toolkit-0.3.10.vsix | sha256sum --check --strict
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-vsix
          path: dist/research-stack-toolkit-0.3.10.vsix
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reviewed-vsix
          path: dist
      - name: Recheck reviewed VSIX
        env:
          REVIEWED_SHA256: ${{ inputs.reviewed_sha256 }}
        run: |
          [[ "$REVIEWED_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]
          printf '%s  %s\n' "$REVIEWED_SHA256" dist/research-stack-toolkit-0.3.10.vsix | sha256sum --check --strict
      - name: Publish exact verified VSIX
        run: npx --yes --package @vscode/vsce@4.1.0 vsce publish --oidc --packagePath dist/research-stack-toolkit-0.3.10.vsix

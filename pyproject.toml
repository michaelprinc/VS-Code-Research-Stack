[project]
name = "research-stack-basic"
version = "0.2.0"
description = "Portable Phase 1 Basic and Phase 2 Recommended local research workspace tools"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "mcp==2.2.0",
  "pypdf==6.4.1",
  "python-docx==1.2.0",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[project.scripts]
research-stack = "research_stack.cli:main"
research-stack-mcp = "research_stack.mcp_server:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_stack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
